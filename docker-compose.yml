services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "8095:8095"
    command: uvicorn observability.api:app --host 0.0.0.0 --port 8095
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    build: .
    environment:
      OBSERVABILITY_API_URL: http://api:8095
      OBSERVABILITY_API_KEY: ${OBSERVABILITY_API_KEY}
    ports:
      - "8501:8501"
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
